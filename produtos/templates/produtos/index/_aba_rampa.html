    <!-- ============================================================================== -->
    <!-- ABA 2: ESTAÇÃO DE RAMPA DE ENVASE EM BATELADA (IN 129/2022)                    -->
    <!-- Tela de pátio: alvos grandes, leitor óptico, feedback sonoro e visual.         -->
    <!-- ============================================================================== -->
    {% if tem_modulo_envase %}
    <div id="aba-conteudo-rampa" class="ds-hidden estacao">
        <header class="ds-page-header">
            <div>
                <h1 class="ds-page-title">Estação de rampa</h1>
                <p class="ds-page-subtitle">Envase em batelada com inspeção pré-envase (IN 129/2022). O leitor óptico funciona como teclado: bipe e o cilindro entra na rampa.</p>
            </div>
        </header>

        <!-- 1. Configuração da batelada -->
        <section class="estacao-config ds-card">
            <div class="form-group">
                <label for="rampa-select-lote">Lote de envase *</label>
                <select id="rampa-select-lote" class="estacao-campo"></select>
            </div>
            <div class="form-group">
                <label for="rampa-pressao-final">Pressão final (bar) *</label>
                <input type="number" id="rampa-pressao-final" class="estacao-campo font-mono" value="200" min="50" max="300" inputmode="numeric">
            </div>
            <div class="estacao-lote-info" id="rampa-lote-info-pill" aria-live="polite"></div>
        </section>

        <!-- 2. Leitor -->
        <section class="estacao-leitor ds-card" id="wedge-scanner-card">
            <label for="input-scanner-wedge" class="estacao-leitor-rotulo">Bipe o QR code ou digite a série e tecle Enter</label>
            <div class="estacao-leitor-linha">
                <input type="text" id="input-scanner-wedge" class="estacao-leitor-input font-mono" autocomplete="off" autocapitalize="characters" spellcheck="false">
                <button type="button" class="btn-primary estacao-btn" id="btn-rampa-acoplar">Acoplar</button>
            </div>
            <div id="rampa-scan-feedback" class="estacao-feedback" role="status" aria-live="assertive"></div>
        </section>

        <!-- 3. Cilindros na rampa -->
        <section aria-labelledby="titulo-rampa-cilindros">
            <h2 class="ds-section-title" id="titulo-rampa-cilindros">Cilindros na rampa <span class="ds-muted" id="rampa-resumo-inspecao"></span></h2>
            <div class="estacao-grade" id="rampa-grid"></div>
        </section>

        <!-- 4. Barra de ações fixa -->
        <div class="estacao-barra">
            <strong id="rampa-contador-cilindros" class="estacao-contador">0 cilindros</strong>
            <div class="estacao-barra-acoes">
                <button type="button" class="btn-outline estacao-btn" id="btn-rampa-limpar">Limpar</button>
                <button type="button" class="btn-secondary estacao-btn" id="btn-rampa-conferir-todos">Conferi todos: conformes</button>
                <button type="button" class="btn-primary estacao-btn estacao-btn-principal" id="btn-concluir-batelada" disabled>Concluir envase</button>
            </div>
        </div>
    </div>
    {% endif %}
