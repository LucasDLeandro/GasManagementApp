<!-- Modal: Baixa Patrimonial de Cilindro (03.2) -->
<div class="modal-overlay" id="modal-baixa-patrimonial" role="dialog" aria-modal="true"
    aria-labelledby="titulo-modal-baixa">
    <div class="modal-content ds-modal-md">
        <div class="modal-header">
            <h3 id="titulo-modal-baixa">Registrar Baixa Patrimonial</h3>
            <button type="button" class="close-modal" data-fechar-modal="modal-baixa-patrimonial"
                aria-label="Fechar">×</button>
        </div>

        <form id="form-baixa-patrimonial" novalidate>
            <input type="hidden" id="baixa-cilindro-id" name="cilindro">
            <div class="modal-body">
                <div class="ds-alert ds-alert-warning mb-4">
                    Atenção: <strong>BAIXADO</strong> é um estado terminal. Após a baixa, o cilindro não poderá ser
                    envasado ou movimentado, restando apenas o estorno pela gestão.
                </div>

                <div class="modal-section-card">
                    <h4 class="modal-section-title">Dados da Baixa</h4>
                    <div class="form-group">
                        <label class="form-label">Cilindro</label>
                        <input type="text" id="baixa-cilindro-label" class="form-control" readonly>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="baixa-tipo" class="form-label">Tipo de Baixa *</label>
                            <select id="baixa-tipo" name="tipo" class="form-control" required>
                                <option value="INUTILIZACAO_TECNICA">Inutilização Técnica / Condenação</option>
                                <option value="EXTRAVIO">Extravio / Perda de Ativo</option>
                                <option value="VENDA">Venda de Ativo Imobilizado</option>
                                <option value="SINISTRO">Sinistro / Destruição Acidental</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="baixa-data" class="form-label">Data da Baixa *</label>
                            <input type="date" id="baixa-data" name="data" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="baixa-documento-ref" id="label-baixa-documento" class="form-label">Documento de
                                Referência (Laudo / B.O. / NF)</label>
                            <input type="text" id="baixa-documento-ref" name="documento_ref" class="form-control"
                                maxlength="100" placeholder="Ex: LAUDO-2026-01, BO-1234, NF-5521">
                        </div>
                        <div class="form-group">
                            <label for="baixa-valor-recebido" class="form-label">Valor Recebido / Indenizado
                                (R$)</label>
                            <input type="number" id="baixa-valor-recebido" name="valor_recebido"
                                class="form-control font-mono" step="0.01" min="0" value="0.00">
                        </div>
                        <div class="form-group ds-col-span-2">
                            <label for="baixa-motivo" class="form-label">Motivo / Justificativa (mín. 10 caracteres)
                                *</label>
                            <textarea id="baixa-motivo" name="motivo" class="form-control" rows="3" minlength="10"
                                required
                                placeholder="Descreva o motivo técnico ou administrativo da baixa patrimonial..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-outline" data-fechar-modal="modal-baixa-patrimonial">Cancelar</button>
                <button type="submit" id="btn-confirmar-baixa" class="btn-danger">Confirmar Baixa</button>
            </div>
        </form>
    </div>
</div>
