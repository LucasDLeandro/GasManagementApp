<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baros Admin | Acesso Seguro SaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 28px; }
        .logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        h1 { color: var(--text-main); font-size: 1.5rem; font-weight: 700; }
        p.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: var(--text-muted); font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover { background: var(--primary-hover); color: #fff; }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <span class="logo-badge">BAROS SAAS 2.0</span>
            <h1>Backoffice Governança</h1>
            <p class="subtitle">Autenticação estrita com 2 Fatores (MFA TOTP)</p>
        </div>

        {% if error %}
        <div class="alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'baros_admin_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuário ou E-mail Superadmin</label>
                <input type="text" id="id_username" name="username" required autocomplete="username" placeholder="admin@baros.io">
            </div>

            <div class="form-group">
                <label for="id_password">Senha Mestra</label>
                <input type="password" id="id_password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="id_otp_token">Token MFA (TOTP - 6 dígitos)</label>
                <input type="text" id="id_otp_token" name="otp_token" maxlength="6" inputmode="numeric" placeholder="123456" autocomplete="one-time-code">
            </div>

            <button type="submit" class="btn-submit">Acessar Backoffice</button>
        </form>

        <div class="footer-note">
            Sessão administrativa protegida por expiração de 30 minutos e registro de auditoria.
        </div>
    </div>
</body>
</html>
